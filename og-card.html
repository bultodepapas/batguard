<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Big+Shoulders+Stencil+Display:wght@900&family=Instrument+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --bg: #11140e; --surface: #191d15; --ink: #e2e5d4; --muted: #9aa088; --line: #2e3526; --accent: #e3a13c; --node: #a3bd6c; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: "Instrument Sans", system-ui, sans-serif; position: relative;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 50px 50px; background-position: -1px -1px; }
  body::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 45%, rgba(17,20,14,.55) 70%, rgba(17,20,14,.2)); }
  .copy { position: absolute; left: 72px; top: 64px; width: 640px; display: grid; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Big Shoulders Stencil Display", sans-serif; font-weight: 900; font-size: 34px; letter-spacing: .08em; }
  .brand svg { width: 64px; height: auto; color: var(--ink); }
  h1 { margin: 0; font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 76px; line-height: .93; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .sub { font-size: 25px; color: var(--muted); line-height: 1.35; max-width: 600px; }
  .tags { display: flex; gap: 10px; flex-wrap: wrap; }
  .tags b { font-weight: 600; font-size: 18px; border: 1.5px solid var(--line); background: var(--surface); padding: 6px 14px; border-radius: 3px; }
  .url { position: absolute; right: 56px; bottom: 34px; font-family: "IBM Plex Mono", monospace; font-size: 18px; color: var(--muted); }
  .scope { position: absolute; right: 40px; top: 50px; width: 470px; height: 470px; }
</style>
</head>
